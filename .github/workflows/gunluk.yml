name: Gunluk veri

on:
  schedule:
    - cron: '0 4,10,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  veri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Veriyi cek
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/veri_cek.py

      - name: Degisikligi kaydet
        run: |
          git config user.name  "sahnede-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Veri: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
            git push
          fi
